<!DOCTYPE html>
<html>
<head>
    <title>Test Image</title>
    <style>
        body { background: #0f172a; color: white; padding: 20px; font-family: sans-serif; }
        img { border: 2px solid #4ade80; margin: 20px 0; }
        .box { background: #1e293b; padding: 20px; border-radius: 8px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Test de Imágenes</h1>

    <div class="box">
        <h2>1. Imagen externa placehold.co (actual)</h2>
        <img src="https://placehold.co/400x400/1e293b/cbd5e1?text=Producto" alt="Test 1" width="200">
        <p>URL: https://placehold.co/400x400/1e293b/cbd5e1?text=Producto</p>
    </div>

    <div class="box">
        <h2>2. Imagen externa via.placeholder.com</h2>
        <img src="https://via.placeholder.com/400x400.png?text=Producto" alt="Test 2" width="200">
        <p>URL: https://via.placeholder.com/400x400.png?text=Producto</p>
    </div>

    <div class="box">
        <h2>3. Imagen externa picsum.photos</h2>
        <img src="https://picsum.photos/400/400" alt="Test 3" width="200">
        <p>URL: https://picsum.photos/400/400</p>
    </div>

    <script>
        document.querySelectorAll('img').forEach((img, index) => {
            img.onerror = function() {
                this.parentElement.querySelector('p').innerHTML += ' <strong style="color: #ef4444;">❌ ERROR AL CARGAR</strong>';
            };
            img.onload = function() {
                this.parentElement.querySelector('p').innerHTML += ' <strong style="color: #4ade80;">✓ CARGADA</strong>';
            };
        });
    </script>
</body>
</html>
