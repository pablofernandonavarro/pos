name: App de escritorio

# Compila la app de escritorio (NativePHP) para Windows y para Mac (Apple Silicon) y las
# publica en el Manager, las dos con la misma versión.
#
#   git tag escritorio-v1.7.0 && git push origin escritorio-v1.7.0   → compila y publica
#   Actions → App de escritorio → Run workflow (versión)             → solo compila (prueba)
#
# Reemplaza a compilar-escritorio.ps1 -Manager: compila desde el repo limpio, así que no se
# puede colar la base ni la identidad de ninguna caja.

on:
  push:
    tags: ['escritorio-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar, ej. 1.7.0 (a mano NO publica: queda como artefacto)'
        required: true

permissions:
  contents: read

concurrency:
  group: escritorio
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # El runner Windows convierte a CRLF al hacer checkout: cambia el texto que el PHP
      # arma adentro (script del cajón) y el código no es el mismo que en el repo.
      - name: Checkout sin convertir fines de línea
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Versión
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#escritorio-v}"; PUBLICAR=1
          else
            VERSION="${{ inputs.version }}"; PUBLICAR=0
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Versión inválida: $VERSION (formato 1.7.0)"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PUBLICAR=$PUBLICAR" >> "$GITHUB_ENV"
          echo "Versión $VERSION · publicar=$PUBLICAR"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, sqlite3, pdo_sqlite, mbstring, intl, fileinfo, curl, openssl
          ini-values: memory_limit=1G
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Una dependencia nueva va en los dos composer*.json (ver CLAUDE.md, "Un solo código").
      - name: Mismas dependencias en la clásica y en el escritorio
        run: |
          php -r '
            $c = json_decode(file_get_contents("composer.json"), true)["require"];
            $e = json_decode(file_get_contents("composer.escritorio.json"), true)["require"];
            $propias = ["php", "nativephp/desktop"];
            $dif = [];
            foreach ($c as $n => $v) { if (!in_array($n, $propias) && ($e[$n] ?? null) !== $v) $dif[] = "$n $v"; }
            foreach ($e as $n => $v) { if (!in_array($n, $propias) && !isset($c[$n])) $dif[] = "$n (solo en escritorio)"; }
            if ($dif) { fwrite(STDERR, "composer.json y composer.escritorio.json no piden lo mismo: ".implode(", ", $dif)."\n"); exit(1); }
            echo "OK\n";'

      - name: Assets
        run: npm ci && npm run build

      - name: composer y .env de escritorio
        env:
          APP_KEY: ${{ secrets.ESCRITORIO_APP_KEY }}
        run: |
          [ -n "$APP_KEY" ] || { echo "::error::Falta el secreto ESCRITORIO_APP_KEY (la APP_KEY compartida de la app de escritorio)"; exit 1; }
          cp composer.escritorio.json composer.json
          cp composer.escritorio.lock composer.lock
          # La APP_KEY es la misma en todas las compilaciones: cambiarla invalida las
          # sesiones de las cajas instaladas.
          sed -e "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" \
              -e "s|^NATIVEPHP_APP_VERSION=.*|NATIVEPHP_APP_VERSION=${VERSION}|" \
              .env.escritorio.example > .env
          grep -q "^NATIVEPHP_APP_VERSION=${VERSION}$" .env

      - name: Dependencias de escritorio (con el parche de NativePHP)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests con NativePHP instalado
        run: php vendor/bin/phpunit

      # native:build termina con error si falla el instalador NSIS, pero win-unpacked queda
      # bien: eso es lo que se distribuye.
      - name: Compilar
        run: |
          php artisan native:build win --no-interaction || echo "native:build terminó con código $?"
          ls nativephp/electron/dist/win-unpacked/*.exe

      - name: Revisar lo que quedó dentro del ejecutable
        run: |
          APP=nativephp/electron/dist/win-unpacked/resources/build/app
          PROHIBIDOS=$(/usr/bin/find nativephp/electron/dist/win-unpacked \( -iname '*.sqlite' -o -iname '*.sqlite-wal' -o -iname '*.sqlite-shm' -o -name '.pos-info' -o -name '.env.escritorio' \))
          [ -z "$PROHIBIDOS" ] || { echo "::error::Se colaron datos de una caja: $PROHIBIDOS"; exit 1; }
          grep -q "^NATIVEPHP_APP_VERSION=${VERSION}\s*$" "$APP/.env" || { echo "::error::El .env compilado no tiene NATIVEPHP_APP_VERSION=${VERSION}"; exit 1; }
          echo OK

      # Misma estructura que pos:publicar-escritorio: todo adentro de POS-Escritorio/.
      - name: Empaquetar
        run: |
          mv nativephp/electron/dist/win-unpacked POS-Escritorio
          7z a -tzip -mx=7 pos-escritorio.zip POS-Escritorio > /dev/null
          SHA=$(sha256sum pos-escritorio.zip | cut -d' ' -f1)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "pos-escritorio.zip $(( $(stat -c %s pos-escritorio.zip) / 1024 / 1024 )) MB · sha256 $SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: POS-Escritorio-${{ env.VERSION }}
          path: pos-escritorio.zip
          retention-days: 14

      # La clave solo puede correr recibir-escritorio en el servidor (comando forzado): no
      # abre una terminal ni puede desplegar código.
      - name: Publicar en el Manager
        if: env.PUBLICAR == '1'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PUBLICAR_SSH_KEY }}" | tr -d '\r' > ~/.ssh/publicar
          chmod 600 ~/.ssh/publicar
          printf '%s\n' "${{ secrets.PUBLICAR_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/publicar -o IdentitiesOnly=yes -o BatchMode=yes \
            "deploy@${{ vars.PUBLICAR_HOST }}" "$VERSION $SHA" < pos-escritorio.zip

  # Mac con Apple Silicon (arm64). Mismo código y misma versión que Windows, desde el mismo
  # tag. Sale sin firma de Developer ID: la primera vez se habilita en Ajustes → Privacidad y
  # seguridad → "Abrir igual" (instructivo en Puntos de venta del Manager).
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#escritorio-v}"; PUBLICAR=1
          else
            VERSION="${{ inputs.version }}"; PUBLICAR=0
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Versión inválida: $VERSION (formato 1.7.0)"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PUBLICAR=$PUBLICAR" >> "$GITHUB_ENV"
          echo "Versión $VERSION · publicar=$PUBLICAR"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, sqlite3, pdo_sqlite, mbstring, intl, fileinfo, curl, openssl
          ini-values: memory_limit=1G
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Assets
        run: npm ci && npm run build

      - name: composer y .env de escritorio
        env:
          APP_KEY: ${{ secrets.ESCRITORIO_APP_KEY }}
        run: |
          [ -n "$APP_KEY" ] || { echo "::error::Falta el secreto ESCRITORIO_APP_KEY (la APP_KEY compartida de la app de escritorio)"; exit 1; }
          cp composer.escritorio.json composer.json
          cp composer.escritorio.lock composer.lock
          sed -e "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" \
              -e "s|^NATIVEPHP_APP_VERSION=.*|NATIVEPHP_APP_VERSION=${VERSION}|" \
              .env.escritorio.example > .env
          grep -q "^NATIVEPHP_APP_VERSION=${VERSION}$" .env

      - name: Dependencias de escritorio (con el parche de NativePHP)
        run: composer install --no-interaction --prefer-dist --no-progress

      # En este runner corren de verdad los tests que solo aplican a Mac (cajón por CUPS,
      # extracción con unzip).
      - name: Tests con NativePHP instalado
        run: php vendor/bin/phpunit

      # Si falla un paso posterior (dmg), el .app igual queda: eso es lo que se distribuye.
      - name: Compilar
        run: |
          php artisan native:build mac arm64 --no-interaction || echo "native:build terminó con código $?"
          APP=$(find nativephp/electron/dist -maxdepth 2 -type d -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "::error::No se generó ningún .app"; ls -R nativephp/electron/dist | head -50; exit 1; }
          file "$APP/Contents/MacOS/"* | grep -q arm64 || { echo "::error::El ejecutable no es arm64"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "Compilado: $APP"

      - name: Revisar lo que quedó dentro de la app
        run: |
          PROHIBIDOS=$(find "$APP" \( -iname '*.sqlite' -o -iname '*.sqlite-wal' -o -iname '*.sqlite-shm' -o -name '.pos-info' -o -name '.env.escritorio' \))
          [ -z "$PROHIBIDOS" ] || { echo "::error::Se colaron datos de una caja: $PROHIBIDOS"; exit 1; }
          ENV_APP=$(find "$APP" -path '*/build/app/.env' | head -1)
          [ -n "$ENV_APP" ] || { echo "::error::No se encontró el .env compilado dentro del .app"; exit 1; }
          grep -q "^NATIVEPHP_APP_VERSION=${VERSION}\s*$" "$ENV_APP" || { echo "::error::El .env compilado no tiene NATIVEPHP_APP_VERSION=${VERSION}"; exit 1; }
          echo OK

      # Abre la app ~30 s y verifica que siga viva. Sin esto, un .app que macOS mata al
      # arrancar (firma, librerías) se publicaba igual: los tests de PHP no lo detectan.
      - name: Preparar prueba de arranque
        run: |
          cat > /tmp/probar-app.sh <<'EOF'
          #!/usr/bin/env bash
          APP="$1"
          EXE="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -1)"
          rm -f ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null
          "$EXE" > /tmp/app.log 2>&1 &
          PID=$!
          sleep 30
          if kill -0 "$PID" 2>/dev/null; then
            echo "La app sigue abierta a los 30 s"
            kill "$PID"; sleep 2; pkill -f "$APP" || true
            exit 0
          fi
          wait "$PID"; echo "La app se cerró al arrancar (código $?)"
          tail -30 /tmp/app.log
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -f "$f" ] || continue
            echo "== $f"; grep -E -A6 '"(procName|exception|termination|asi)"' "$f" | head -40
          done
          exit 1
          EOF
          chmod +x /tmp/probar-app.sh
          echo "PHP dentro de la app:"; find "$APP" -type f -name 'php' -perm -u+x | head -3

      # Firma tal como la deja electron-builder (con hardened runtime), solo para diagnóstico.
      - name: Diagnóstico de la firma original
        continue-on-error: true
        run: |
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|flags'
          /tmp/probar-app.sh "$APP"

      # En Apple Silicon un .app sin firma no arranca, y sin cuenta de Apple la firma es ad-hoc
      # (identidad "-"). electron-builder la firma con hardened runtime, que solo sirve para
      # notarizar y que con firma ad-hoc hace que macOS no cargue el framework de Electron: la
      # app se cierra al abrirla. Se vuelve a firmar ad-hoc, sin hardened runtime.
      - name: Firma ad-hoc sin hardened runtime
        run: |
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Signature|flags'

      - name: Probar que la app abre
        run: /tmp/probar-app.sh "$APP"

      # La prueba de arranque corre la app que se va a empaquetar. Si al arrancar escribe dentro
      # del .app (pasó con route:cache en bootstrap/cache), la firma queda inválida y macOS la
      # trata como dañada en la caja: se corta acá en vez de publicarla.
      - name: La firma sigue válida después de abrirla
        run: codesign --verify --deep --strict -vv "$APP"

      # ditto y no zip: el .app de Electron trae symlinks en sus frameworks y un zip común los
      # convierte en copias, y macOS dice que la app "está dañada".
      - name: Empaquetar
        run: |
          ditto -c -k --keepParent "$APP" pos-escritorio-mac.zip
          SHA=$(shasum -a 256 pos-escritorio-mac.zip | cut -d' ' -f1)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "pos-escritorio-mac.zip $(( $(stat -f %z pos-escritorio-mac.zip) / 1024 / 1024 )) MB · sha256 $SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: POS-Escritorio-Mac-${{ env.VERSION }}
          path: pos-escritorio-mac.zip
          retention-days: 14

      - name: Publicar en el Manager
        if: env.PUBLICAR == '1'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PUBLICAR_SSH_KEY }}" | tr -d '\r' > ~/.ssh/publicar
          chmod 600 ~/.ssh/publicar
          printf '%s\n' "${{ secrets.PUBLICAR_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/publicar -o IdentitiesOnly=yes -o BatchMode=yes \
            "deploy@${{ vars.PUBLICAR_HOST }}" "$VERSION $SHA mac" < pos-escritorio-mac.zip
